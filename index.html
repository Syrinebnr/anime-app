<body>

  <div class="hero">
    <h1>ANIME EXPLORER</h1>
    <p>Explore the world of anime</p>
  </div>

  <div class="top-controls">

    <input type="text" id="search" placeholder="Zoek anime..." />

    <select id="filter">
      <option value="all">Alle anime</option>
      <option value="Currently Airing">Airing</option>
      <option value="Finished Airing">Finished</option>
      <option value="favorites">Favorieten</option>
    </select>

    <select id="sort">
      <option value="default">Sorteer</option>
      <option value="high">Hoogste score</option>
      <option value="low">Laagste score</option>
    </select>

    <button id="theme-btn">Toggle Theme</button>

  </div>

  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>

</body>
